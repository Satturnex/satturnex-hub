<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f18" />
    <meta name="description" content="Satturnex Hub — portal central para acessar sistemas, serviços e recursos da Satturnex." />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("satturnex-theme") || preference; } catch {}
        if (preference !== "light" && preference !== "dark" && preference !== "system") preference = "system";
        const dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>Satturnex Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
